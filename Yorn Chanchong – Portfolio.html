<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Yorn Chanchong – Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        /* ===== COLORS: change the values here ===== */
        
         :root {
            color-scheme: dark;
            --bg: #0e1525;
            --surface: rgba(255, 255, 255, .06);
            --surface2: rgba(255, 255, 255, .1);
            --ink: #f3f6fc;
            --muted: #a6b0c5;
            --line: rgba(255, 255, 255, .12);
            --c1: #2f8cff;
            --c2: #c13fd0;
            --c3: #7a4bf5;
            --blob: .5;
            --grad: linear-gradient(90deg, var(--c1), var(--c2));
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }
        
        @media (prefers-color-scheme:light) {
             :root:not([data-theme="dark"]) {
                color-scheme: light;
                --bg: #f2f5fb;
                --surface: rgba(255, 255, 255, .8);
                --surface2: #fff;
                --ink: #121a2e;
                --muted: #4f5b74;
                --line: rgba(18, 26, 46, .14);
                --c1: #1f6fe0;
                --c2: #a82cb8;
                --c3: #6a3be0;
                --blob: .25
            }
        }
        
         :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f2f5fb;
            --surface: rgba(255, 255, 255, .8);
            --surface2: #fff;
            --ink: #121a2e;
            --muted: #4f5b74;
            --line: rgba(18, 26, 46, .14);
            --c1: #1f6fe0;
            --c2: #a82cb8;
            --c3: #6a3be0;
            --blob: .25
        }
        
        html {
            scroll-padding-top: 5.5rem;
            scroll-behavior: smooth;
            background: var(--bg)
        }
        
        * {
            box-sizing: border-box
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative
        }
        
        .blobs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden
        }
        
        .blobs i {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: var(--blob)
        }
        
        .blobs i:nth-child(1) {
            width: 34rem;
            height: 34rem;
            background: var(--c3);
            top: -8rem;
            left: 8%
        }
        
        .blobs i:nth-child(2) {
            width: 30rem;
            height: 30rem;
            background: var(--c2);
            top: 2rem;
            right: 6%;
            opacity: calc(var(--blob)*.8)
        }
        
        .blobs i:nth-child(3) {
            width: 34rem;
            height: 34rem;
            background: var(--c1);
            bottom: -10rem;
            left: 35%;
            opacity: calc(var(--blob)*.8)
        }
        
        a {
            color: inherit
        }
        
         :focus-visible {
            outline: 3px solid var(--c1);
            outline-offset: 3px
        }
        
        .wrap {
            max-width: 72rem;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1
        }
        
        body::before {
            content: "";
            position: fixed;
            inset: 0 0 auto;
            height: env(safe-area-inset-top, 0px);
            z-index: 19;
            background: var(--bg)
        }
        
        header {
            position: sticky;
            top: calc(env(safe-area-inset-top, 0px) + .75rem);
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: .6rem .8rem .6rem .7rem;
            margin-top: .75rem;
            border: 1px solid var(--line);
            border-radius: 1rem;
            background: var(--surface);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px)
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: .7rem;
            text-decoration: none;
            font-weight: 800
        }
        
        .logo b {
            width: 2.4rem;
            height: 2.4rem;
            border-radius: .7rem;
            background: var(--grad);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: .95rem
        }
        
        .logo small {
            display: block;
            font-weight: 400;
            color: var(--muted);
            font-size: .72rem;
            line-height: 1.1
        }
        
        nav {
            display: flex;
            gap: 1.5rem;
            font-size: .92rem
        }
        
        nav a {
            text-decoration: none;
            color: var(--ink)
        }
        
        nav a:hover {
            color: var(--c1)
        }
        
        .right {
            display: flex;
            align-items: center;
            gap: .6rem
        }
        
        .icon {
            width: 2.3rem;
            height: 2.3rem;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--ink);
            display: grid;
            place-items: center;
            cursor: pointer;
            font: inherit;
            font-size: 1rem;
            text-decoration: none
        }
        
        .icon:hover {
            background: var(--surface2)
        }
        
        .btn {
            display: inline-block;
            border: 0;
            background: var(--grad);
            color: #fff;
            padding: .8rem 1.4rem;
            border-radius: .8rem;
            text-decoration: none;
            font-weight: 600;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }
        
        .btn:hover {
            filter: brightness(1.12)
        }
        
        .btn.ghost {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line)
        }
        
        .hero {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 3rem;
            align-items: center;
            padding: 4.5rem 0 5rem;
            min-height: 36rem
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 999px;
            padding: .4rem 1rem;
            font-size: .82rem;
            margin-bottom: 1.6rem
        }
        
        .status::before {
            content: "";
            width: .7rem;
            height: .7rem;
            border-radius: 50%;
            background: var(--c1);
            box-shadow: 0 0 0 4px rgba(47, 140, 255, .25)
        }
        
        .hi {
            font-size: 1.5rem;
            color: var(--muted);
            margin: 0
        }
        
        h1 {
            font-size: clamp(3rem, 8vw, 5.2rem);
            line-height: 1.02;
            letter-spacing: -.03em;
            font-weight: 800;
            margin: .2rem 0 .8rem
        }
        
        .role {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 1.2rem
        }
        
        .role span {
            color: var(--c1);
            text-shadow: 0 0 22px rgba(47, 140, 255, .6)
        }
        
        .role em {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--c1);
            vertical-align: -.2em;
            margin-left: 3px
        }
        
        .lead {
            color: var(--muted);
            max-width: 30rem;
            margin: 0 0 1.4rem
        }
        
        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            padding: 0;
            margin: 0 0 1.8rem;
            list-style: none
        }
        
        .tags li {
            color: #fff;
            font-size: .78rem;
            font-weight: 600;
            padding: .3rem .9rem;
            border-radius: 999px
        }
        
        .tags li:nth-child(1) {
            background: #2f8cff
        }
        
        .tags li:nth-child(2) {
            background: #c13fd0
        }
        
        .tags li:nth-child(3) {
            background: #e8870c
        }
        
        .tags li:nth-child(4) {
            background: #0aa5c9
        }
        
        .tags li:nth-child(5) {
            background: #15a860
        }
        
        .tags li:nth-child(6) {
            background: #7a4bf5
        }
        
        .cta {
            display: flex;
            flex-wrap: wrap;
            gap: .9rem;
            margin-bottom: 1.6rem
        }
        
        .follow {
            display: flex;
            align-items: center;
            gap: .6rem;
            color: var(--muted);
            font-size: .82rem
        }
        
        .follow .icon {
            width: 2rem;
            height: 2rem;
            font-size: .72rem;
            font-weight: 800
        }
        
        .visual {
            position: relative;
            display: grid;
            place-items: center;
            min-height: 25rem
        }
        
        .ring {
            width: min(20rem, 78vw);
            aspect-ratio: 1;
            border-radius: 50%;
            padding: 6px;
            background: conic-gradient(var(--c1), var(--c2), var(--c3), var(--c1));
            box-shadow: 0 0 60px rgba(193, 63, 208, .35)
        }
        
        .ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 4px solid var(--bg)
        }
        
        .float {
            position: absolute;
            border: 1px solid var(--line);
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: .9rem
        }
        
        .code {
            top: -1rem;
            right: -1rem;
            padding: .9rem 1.1rem;
            font: .78rem/1.6 ui-monospace, Menlo, Consolas, monospace;
            color: var(--muted);
            background: rgba(18, 22, 36, .85);
            color: #c9d3ea;
            max-width: 15rem
        }
        
        .code .d {
            display: inline-block;
            width: .6rem;
            height: .6rem;
            border-radius: 50%;
            margin-right: .3rem
        }
        
        .code .k {
            color: #c586f0
        }
        
        .code .s {
            color: #7ee0a0
        }
        
        .code .y {
            color: #f2c75c
        }
        
        .stat {
            text-align: center;
            padding: .8rem 1.2rem;
            font-size: .78rem;
            color: var(--muted)
        }
        
        .stat b {
            display: block;
            font-size: 1.8rem;
            line-height: 1.1;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }
        
        .s1 {
            left: 0;
            bottom: 2rem
        }
        
        .s2 {
            right: .5rem;
            bottom: 4rem
        }
        
        h2 {
            font-size: clamp(1.9rem, 4vw, 2.6rem);
            letter-spacing: -.03em;
            line-height: 1.1;
            margin: 0 0 .6rem
        }
        
        h2 span {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }
        
        .sub {
            color: var(--muted);
            margin: 0 0 2rem;
            max-width: 36rem
        }
        
        section {
            padding: 3.5rem 0
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
            gap: 1.5rem
        }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 1rem;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform .2s, box-shadow .2s
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(122, 75, 245, .3)
        }
        
        .card button {
            all: unset;
            cursor: zoom-in;
            display: block
        }
        
        .card button:focus-visible {
            outline: 3px solid var(--c1);
            outline-offset: -3px
        }
        
        .card img {
            width: 100%;
            aspect-ratio: 3/2;
            object-fit: cover;
            display: block
        }
        
        .card div {
            padding: 1.1rem 1.2rem 1.3rem
        }
        
        .card h3 {
            margin: 0 0 .25rem;
            font-size: 1.25rem
        }
        
        .card .meta {
            color: var(--c1);
            font-weight: 600;
            font-size: .9rem;
            margin: 0 0 .5rem
        }
        
        .card p {
            margin: 0;
            color: var(--muted);
            font-size: .97rem
        }
        
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: .7rem;
            padding: 0;
            margin: 0;
            list-style: none
        }
        
        .skills li {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: .5rem 1.1rem;
            background: var(--surface)
        }
        
        .about p {
            max-width: 40rem;
            margin: 0 0 1rem;
            color: var(--muted)
        }
        
        .mail {
            font-size: clamp(1.4rem, 4.5vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -.02em;
            word-break: break-all;
            text-decoration-thickness: 3px;
            text-underline-offset: .2em;
            text-decoration-color: var(--c2)
        }
        
        footer {
            padding: 1.5rem 0 2rem;
            color: var(--muted);
            border-top: 1px solid var(--line);
            font-size: .9rem
        }
        
        dialog {
            border: 0;
            padding: 0;
            background: transparent;
            max-width: min(94vw, 64rem);
            width: 100%
        }
        
        dialog::backdrop {
            background: rgba(0, 0, 0, .8)
        }
        
        dialog img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: .6rem
        }
        
        dialog form {
            margin: 0
        }
        
        dialog .close {
            position: absolute;
            top: .5rem;
            right: .5rem;
            background: var(--grad);
            color: #fff;
            border: 0;
            border-radius: 999px;
            padding: .5rem 1rem;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }
        
        @media (max-width:860px) {
            .hero {
                grid-template-columns: 1fr;
                padding-top: 3rem
            }
            nav {
                display: none
            }
            .visual {
                margin-top: 1rem
            }
            .code {
                right: 0
            }
        }
        
        @media (prefers-reduced-motion:reduce) {
            * {
                scroll-behavior: auto!important;
                transition: none!important
            }
        }
    </style>
</head>

                <p class="sub" id="contactText"></p>

            </section>
        </main>
        <footer id="foot"></footer>
    </div>
    <dialog id="box">

        $("code").innerHTML = '<span class="k">const</span> me = {<br>&nbsp; name: <span class="s"></span>,<br>&nbsp; skills: <span class="s">["Video","Design"]</span>,<br>&nbsp; passion: <span class="y">"creating"</span><br>};';
        $("code").querySelector(".s").textContent = '"' + SITE.firstName + '"';
        SITE.tags.forEach(t => $("tags").appendChild(mk("li", t)));
        SITE.links.forEach(l => {
            const a = mk("a", l.t, "icon");
            a.href = l.url;
            a.setAttribute("aria-label", l.name);
            $("links").appendChild(a);
        });
        $("st1").textContent = SITE.stats[0].n;
        $("sl1").textContent = SITE.stats[0].l;
        $("st2").textContent = SITE.stats[1].n;
        $("sl2").textContent = SITE.stats[1].l;
        $("expIntro").textContent = SITE.expIntro;
        $("contactText").textContent = SITE.contactText;
        $("mail").textContent = SITE.email;
        $("mail").href = "mailto:" + SITE.email;
        $("foot").textContent = "© " + SITE.year + " " + SITE.name;
        SITE.skills.forEach(s => $("skillList").appendChild(mk("li", s)));
        SITE.about.forEach(t => $("aboutText").appendChild(mk("p", t)));
        EXPERIENCE.forEach(e => {
            const c = mk("article", "", "card");
            const b = mk("button");
            b.setAttribute("aria-label", "View certificate: " + e.title);
            const i = mk("img");
            i.src = IMG[e.img];
            i.alt = "Certificate for " + e.title;
            i.loading = "lazy";
            b.appendChild(i);
            b.addEventListener("click", () => {
                $("big").src = IMG[e.img];
                $("big").alt = i.alt;
                $("box").showModal();
            });
            const d = mk("div");
            d.append(mk("h3", e.title), mk("p", e.meta, "meta"), mk("p", e.text));
            c.append(b, d);
            $("cards").appendChild(c);
        });
        $("box").addEventListener("click", e => {
            if (e.target === $("box")) $("box").close();
        });

        /* Theme toggle */
        const root = document.documentElement,
            mq = matchMedia("(prefers-color-scheme: light)");
        const isLight = () => root.dataset.theme ? root.dataset.theme === "light" : mq.matches;
        const sync = () => $("theme").textContent = isLight() ? "☾" : "☀";
        $("theme").addEventListener("click", () => {
            root.dataset.theme = isLight() ? "dark" : "light";
            sync();
        });
        sync();

        /* Typing effect (static when reduced motion is on) */
        const typed = $("typed");
        let ri = 0,
            ci = 0,
            del = false;
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
            typed.textContent = SITE.roles[0];
        } else(function tick() {
            const w = SITE.roles[ri];
            ci += del ? -1 : 1;
            typed.textContent = w.slice(0, ci);
            let wait = del ? 45 : 90;
            if (!del && ci === w.length) {
                del = true;
                wait = 1400;
            } else if (del && ci === 0) {
                del = false;
                ri = (ri + 1) % SITE.roles.length;
                wait = 350;
            }
            setTimeout(tick, wait);
        })();
    </script>
</body>

</html>
